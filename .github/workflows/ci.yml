name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.11", "3.13"]
        include:
          # one Windows leg gives the LF-output guard real teeth (write_text would emit CRLF there)
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev deps
        run: python -m pip install -e ".[dev]"
      - name: Validate gate
        run: python validate.py
      - name: Tests
        run: pytest -q
      - name: Drift benchmark
        run: python benchmarks/drift/run.py --check
