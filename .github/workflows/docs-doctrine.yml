name: Docs Doctrine

on:
  push:
    paths: ["**/*.md", ".github/workflows/docs-doctrine.yml"]
  pull_request:
    paths: ["**/*.md", ".github/workflows/docs-doctrine.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  doctrine:
    uses: alawein/alawein/.github/workflows/doctrine-reusable.yml@07c7ec7dfed454e30f3cf2c217171e1270736850
    with:
      strict: "true"
