name: Docs Doctrine

on:
  push:
    paths: ["**/*.md", ".github/workflows/docs-doctrine.yml"]
  pull_request:
    paths: ["**/*.md", ".github/workflows/docs-doctrine.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  doctrine:
    uses: alawein/alawein/.github/workflows/doctrine-reusable.yml@1256254075d5e917484d3a51d258cc8ccd94f3b6
    with:
      strict: "true"
