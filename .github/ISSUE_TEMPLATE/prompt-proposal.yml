name: Prompt proposal
description: Propose a new core prompt. Must clear the ADR-0025 admission bar.
title: "[prompt] "
labels: ["type:feature", "area:prompts"]
body:
  - type: markdown
    attributes:
      value: |
        A new prompt is expected to clear the admission bar in
        [ADR-0025](https://github.com/alawein/outpost/blob/main/docs/decisions/0025-relax-prompt-admission.md)
        (superseding [ADR-0013](https://github.com/alawein/outpost/blob/main/docs/decisions/0013-prompt-admission.md))
        before it enters the pack. Recurring task, nearest existing prompt, and unsafe default are
        required; a proposal missing one of those three will not be admitted. Binding mechanism,
        dogfood case, and deletion condition are recommended, not blocking, but the field cannot be
        left blank: fill it in if you have it, or write one line naming the follow-up PR that will.
  - type: textarea
    id: recurring_task
    attributes:
      label: Recurring task
      description: The job this prompt would own, that no shipped prompt owns.
    validations:
      required: true
  - type: textarea
    id: nearest_sibling
    attributes:
      label: Nearest existing prompt
      description: The closest shipped prompt, and what this one does that it does not.
    validations:
      required: true
  - type: textarea
    id: unsafe_default
    attributes:
      label: Unsafe default
      description: The wrong behavior an agent falls into without this prompt. No unsafe default, no entry.
    validations:
      required: true
  - type: textarea
    id: binding_mechanism
    attributes:
      label: Binding mechanism (recommended)
      description: The contract line (an input, step, or stop condition) that blocks the unsafe default. Not blocking, but do not leave blank; if you don't have it yet, write "follow-up: <link>".
    validations:
      required: true
  - type: textarea
    id: dogfood_case
    attributes:
      label: Dogfood case (recommended)
      description: The real run in this repo that will prove it, recorded in docs/dogfooding.md. Not blocking, but do not leave blank; if you don't have it yet, write "follow-up: <link>".
    validations:
      required: true
  - type: textarea
    id: deletion_condition
    attributes:
      label: Deletion condition (recommended)
      description: The observation that would remove this prompt later. Not blocking, but do not leave blank; if you don't have it yet, write "follow-up: <link>".
    validations:
      required: true
  - type: dropdown
    id: provenance
    attributes:
      label: Provenance
      description: Where this idea comes from.
      options:
        - OUTPOST-ORIGIN (reused or refactored from existing Outpost work)
        - CLEAN-ROOM (independently implemented from an abstract capability observed elsewhere)
        - GENERAL-PRACTICE (independent implementation of a normal practice)
        - UNKNOWN (not yet determined; do not implement until this is resolved)
    validations:
      required: true
