<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#768390"/>
    </marker>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f81f7"/>
      <stop offset="1" stop-color="#7a5cff"/>
    </linearGradient>
  </defs>

  <text x="42" y="24" fill="#768390" font-size="12" letter-spacing="2">ONE PATH, EVERY TOOL</text>

  <!-- main spine -->
  <g fill="none" stroke="url(#spine)" stroke-width="1.8">
    <rect x="42"  y="44" width="104" height="42" rx="9"/>
    <rect x="162" y="44" width="104" height="42" rx="9"/>
    <rect x="282" y="44" width="104" height="42" rx="9"/>
    <rect x="402" y="44" width="104" height="42" rx="9"/>
    <rect x="522" y="44" width="104" height="42" rx="9"/>
    <rect x="642" y="44" width="104" height="42" rx="9"/>
    <rect x="762" y="44" width="104" height="42" rx="9"/>
  </g>
  <g fill="#1f6feb" font-size="15" font-weight="600" text-anchor="middle">
    <text x="94"  y="70">orient</text>
    <text x="214" y="70">plan</text>
    <text x="334" y="70">build</text>
    <text x="454" y="70">test</text>
    <text x="574" y="70">review</text>
    <text x="694" y="70">ship</text>
    <text x="814" y="70">hand off</text>
  </g>

  <g stroke="#768390" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="146" y1="65" x2="160" y2="65"/>
    <line x1="266" y1="65" x2="280" y2="65"/>
    <line x1="386" y1="65" x2="400" y2="65"/>
    <line x1="506" y1="65" x2="520" y2="65"/>
    <line x1="626" y1="65" x2="640" y2="65"/>
    <line x1="746" y1="65" x2="760" y2="65"/>
  </g>

  <!-- branch steps under build and test -->
  <g stroke="#768390" stroke-width="1.2" stroke-dasharray="4 3">
    <line x1="334" y1="86" x2="334" y2="120"/>
    <line x1="454" y1="86" x2="454" y2="120"/>
    <rect x="282" y="122" width="104" height="30" rx="8" fill="none"/>
    <rect x="402" y="122" width="104" height="30" rx="8" fill="none"/>
  </g>
  <g fill="#768390" font-size="13" text-anchor="middle">
    <text x="334" y="141">debug-failure</text>
    <text x="454" y="141">write-tests</text>
  </g>

  <!-- converge under review -->
  <g stroke="#768390" stroke-width="1.2" stroke-dasharray="4 3">
    <line x1="574" y1="86" x2="574" y2="120"/>
    <rect x="522" y="122" width="104" height="30" rx="8" fill="none"/>
  </g>
  <text x="574" y="141" fill="#768390" font-size="13" text-anchor="middle">converge</text>

  <!-- scrutiny band -->
  <rect x="42" y="176" width="824" height="34" rx="17" fill="none" stroke="#7a5cff" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="454" y="198" fill="#7a5cff" font-size="13" text-anchor="middle">pressure-test any step: interrogate / grill / self-refute / premortem / prove / panel</text>

  <text x="42" y="232" fill="#768390" font-size="12">The prompt pack for Claude, Codex, Cursor, and Copilot; Claude installs the prompts as skills</text>
</svg>
