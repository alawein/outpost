[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "outpost"
version = "0.2.1"
description = "A small personal kit that helps coding agents read a repo, plan, edit, test, review, prepare PRs, and hand off. Claude Code is the primary target; Codex, Cursor, and GitHub Copilot are adapters."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "alawein" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

# No console-script entry point: the kit is used from a clone with `python install.py` and
# `python validate.py`, not installed as a wheel. A packaged distribution is an idea-backlog item
# (docs/ROADMAP.md), not a v0.1.0 promise.

[tool.setuptools]
packages = ["kit", "kit.catalog", "kit.checks", "kit.installers", "kit.adapters", "kit.labels"]

[tool.pytest.ini_options]
testpaths = ["tests"]
